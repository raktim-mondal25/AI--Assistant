<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Friday</title>

        <link rel="shortcut icon" href="assests/img/Untitled design.png"
            type="image/x-icon">

        <!-- bootstrap -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
            crossorigin="anonymous">

        <!-- bootstrap-icons -->
        <link rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

        <!-- Particle  -->
        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/modernizr/2.8.3/modernizr.min.js"
            type="text/javascript"></script>

        <!-- Textillate -->
        <link rel="stylesheet" href="assests/vendore/texllate/animate.css">

        <link rel="stylesheet" href="style.css">

    </head>

    <body>

        <div class="container">
            

            <section id="oval" class="mb-4">
                <div class="row">
                    <div class="col-md-1"></div>
                    <div class="col-md-10">
                        <div
                            class="d-flex justify-content-center align-items-center"
                            style="height: 80vh;">
                            <canvas id="canvasOne" width="700" height="420"
                                style="position: absolute;"></canvas>

                            <div id="jarvishood">
                                <div class="square">
                                    <span class="circle"></span>
                                    <span class="circle"></span>
                                    <span class="circle"></span>
                                </div>
                            </div>
                        </div>

                        <h5 class="text-light text text-center ">Ask me Anything</h5>

                        <div class="col-md-12 mt-3 pt-2">
                            <div class="text-center">
                                <div id="Textinput" class="d-flex">
                                    <input type="text" name="chatbox"
                                        id="chatbox"
                                        placeholder="Type here ....">
                                    <button id="SendBtn"
                                        class="glow-on-hover hidden"><i
                                            class="bi bi-send"></i></button>
                                    <button id="mic-button"
                                        class="glow-on-hover"><i
                                            class="bi bi-mic"></i></button>
                                    <button id="chat-button"
                                        class="glow-on-hover"
                                        data-bs-toggle="offcanvas"
                                        data-bs-target="#offcanvasScrolling"
                                        aria-controls="offcanvasScrolling"><i
                                            class="bi bi-chat-dots"></i></button>
                                    <button id="settings-button"
                                        class="glow-on-hover"><i
                                            class="bi bi-gear"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-1"></div>
                </div>
            </section>

            <section id="SiriWave" class="mb-4 hidden">
                <div class="container-siri">
                    <fiv class="row">
                        <div class="col-md-12">
                            <div
                                class="d-flex justify-content-center align-items-center"
                                style="height: 100vh;">
                                <div class="d-flex">
                                    <p
                                        class="text-start text-light mb-4 siri-message animate"
                                        style="font-size: x-large;">Hello, I am Friday. How can I assist you?</p>
                                    <div id="siri-container"></div>
                                </div>
                            </div>
                        </div>
                    </fiv>
                </div>
            </section>
        </div>

        <div class="offcanvas offcanvas-start chat-canvas" data-bs-scroll="true"
            data-bs-backdrop="false" tabindex="-1" id="offcanvasScrolling"
            aria-labelledby="offcanvasScrollingLabel">
            <div class="offcanvas-header">
                <h5 class="offcanvas-title text-white"
                    id="offcanvasScrollingLabel">Chats</h5>
                <button type="button" class="btn-close text-reset"
                    data-bs-dismiss="offcanvas" aria-label="Close"></button>
            </div>
            <div id="chat-canvas-body" class="offcanvas-body">

            </div>
        </div>

        <!--Jquery  -->
        <script
            src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>

        <!-- Bootstrap -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
            crossorigin="anonymous"></script>

        <!-- particle -->
        <script src="script.js"></script>
        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
        <script
            src="https://ajax.googleapis.com/ajax/libs/jqueryui/1.11.2/jquery-ui.min.js"></script>

        <!-- Textillate -->
        <script src="assests/vendore/texllate/jquery.fittext.js"></script>
        <script src="assests/vendore/texllate/jquery.lettering.js"></script>
        <script
            src="http://jschr.github.io/textillate/jquery.textillate.js"></script>

        <!--Siri wave-->
        <script
            src="https://unpkg.com/siriwave/dist/siriwave.umd.min.js"></script>

        <!-- lottie files -->
        <script
            src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

        <!-- own js file -->
        <script src="main.js"></script>

        <script src="/eel.js"></script>

        <script src="controler.js"></script>
    </body>

</html>
